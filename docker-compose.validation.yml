name: matchskill-validation

# Disposable local integration services. Never point production at these ports.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: matchskill_validation
      POSTGRES_USER: matchskill_validation
      POSTGRES_PASSWORD: local-validation-only
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchskill_validation -d matchskill_validation"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
