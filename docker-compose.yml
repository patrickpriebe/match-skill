services:
  postgres:
    image: postgres:15-alpine
    container_name: matchskill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-matchskill}
      POSTGRES_USER: ${DB_USER:-matchskill}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-matchskill}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-matchskill}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - matchskill

  redis:
    image: redis:7-alpine
    container_name: matchskill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - matchskill

networks:
  matchskill:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
