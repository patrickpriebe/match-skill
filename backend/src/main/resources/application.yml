server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: match-skill-backend

  # SecurityConfig registers Google only when both credentials are configured.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:matchskill}
    username: ${DB_USER:matchskill}
    password: ${DB_PASSWORD:matchskill}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/auth/google/callback"

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:5173/auth/callback}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  meeting-url:
    allowed-hosts: zoom.us,meet.google.com,teams.microsoft.com,whereby.com
  rate-limit:
    login-max-requests: 5
    login-window-seconds: 60
    register-max-requests: 5
    register-window-seconds: 60
    create-exchange-max-requests: 20
    create-exchange-window-seconds: 60
